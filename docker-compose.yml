services:
  luvox:
    build: .
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      LUVOX_DATA_DIR: /app/data
      LUVOX_TRUST_CONTAINER_PROXY: 1
      NODE_ENV: production
    volumes:
      - luvox-data:/app/data
    restart: unless-stopped

volumes:
  luvox-data:
